<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NexaForge | Admin Messages</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            margin-bottom: 40px;
        }

        .admin-header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .admin-header p {
            color: #94a3b8;
            font-size: 17px;
        }

        .messages-container {
            overflow-x: auto;
            background-color: #172554;
            border: 1px solid #263b72;
            border-radius: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 18px;
            text-align: left;
            border-bottom: 1px solid #263b72;
        }

        th {
            color: #fca311;
            font-size: 14px;
            text-transform: uppercase;
        }

        td {
            color: #cbd5e1;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .message-cell {
            max-width: 350px;
            white-space: normal;
            line-height: 1.5;
        }

        .empty-message {
            padding: 40px;
            text-align: center;
            color: #94a3b8;
        }

        .error-message {
            padding: 40px;
            text-align: center;
            color: #f87171;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 20px;
            background-color: #fca311;
            color: #0f172a;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .back-button:hover {
            background-color: #ffb52e;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            .admin-header h1 {
                font-size: 32px;
            }
        }

        .delete-button {
            padding: 8px 14px;
            background-color: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-button:hover {
            background-color: #b91c1c;
        }

        .logout-button {
            margin-top: 30px;
            margin-left: 10px;
            padding: 12px 20px;
            background-color: #dc2626;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

.logout-button:hover {
    background-color: #b91c1c;
}
    </style>
</head>

<body>

    <div class="admin-container">

        <div class="admin-header">
            <h1>NexaForge Admin</h1>
            <p>Contact messages received from your website.</p>
        </div>

        <div class="messages-container">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Subject</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="messagesTable">
                    <tr>
                        <td colspan="7" class="empty-message">
                            Loading messages...
                        </td>
                    </tr>
                </tbody>
            </table>

        <div>
            <a href="../index.html" class="back-button">
                ← Back to Website
            </a>

            <button class="logout-button" onclick="logoutAdmin()">
                Logout
            </button>
        </div>


    <script>

        async function loadMessages() {

            const table = document.querySelector("#messagesTable");

            try {

                const response = await fetch("https://nexaforge-production.up.railway.app/api/messages", {
                    credentials: "include"
                });

                if (response.status === 401) {
                    window.location.href = "login.html";
                    return;
                }

                if (!response.ok) {
                    throw new Error("Failed to load messages.");
                }

                const messages = await response.json();

                if (messages.length === 0) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty-message">
                                No contact messages yet.
                            </td>
                        </tr>
                    `;

                    return;
                }

                table.innerHTML = "";

                messages.forEach(function (message) {

                    const row = document.createElement("tr");

                        row.innerHTML = `
                            <td>${message.id}</td>
                            <td>${message.name}</td>
                            <td>${message.email}</td>
                            <td>${message.subject}</td>
                            <td class="message-cell">${message.message}</td>
                            <td>${new Date(message.created_at).toLocaleString()}</td>
                            <td>
                                <button class="delete-button" onclick="deleteMessage(${message.id})">
                                    Delete
                                </button>
                            </td>
                        `;

                    table.appendChild(row);

                });

            } catch (error) {

                console.error(error);

                table.innerHTML = `
                    <tr>
                        <td colspan="6" class="error-message">
                            Unable to load messages from the server.
                        </td>
                    </tr>
                `;
            }
        }
        async function deleteMessage(id) {

    const confirmed = confirm("Are you sure you want to delete this message?");

    if (!confirmed) {
        return;
    }

    try {

        const response = await fetch(`https://nexaforge-production.up.railway.app/api/messages/${id}`, {
                method: "DELETE",
                credentials: "include"
            }
        );

        const data = await response.json();

        if (data.success) {

            alert("Message deleted successfully!");

            loadMessages();

        } else {

            alert("Failed to delete message.");

        }

    } catch (error) {

        console.error(error);

        alert("Unable to connect to the server.");

    }
}

async function logoutAdmin() {

    try {

        const response = await fetch(
            "https://nexaforge-production.up.railway.app/api/logout",
            {
                method: "POST",
                credentials: "include"
            }
        );

        const data = await response.json();

        if (data.success) {

            window.location.href = "login.html";

        } else {

            alert("Logout failed.");

        }

    } catch (error) {

        console.error(error);
        alert("Unable to connect to the server.");

    }
}
        loadMessages();

    </script>

</body>

</html>
